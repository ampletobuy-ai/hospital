name: Deploy Features VPS

on:
  push:
    branches:
      - Features
    paths-ignore:
      - "docs/**"
      - "**/*.md"
  workflow_dispatch:
    inputs:
      build_on_vps:
        description: Build images on VPS instead of pulling GHCR
        required: false
        default: "true"
        type: choice
        options:
          - "true"
          - "false"

concurrency:
  group: deploy-hospital-features
  cancel-in-progress: false

jobs:
  ci-gate:
    name: CI gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          coverage: none
          tools: none

      - name: Package sanity
        run: |
          set -euo pipefail
          test -f index.php
          test -f .env.example
          test -d application/controllers
          test -d application/libraries
          test -f application/libraries/Plan_feature_gate.php
          test -f .htaccess
          echo "Package sanity OK"

      - name: PHP syntax check
        run: |
          set -euo pipefail
          fail=0
          while IFS= read -r -d '' file; do
            if ! php -l "$file" >/dev/null; then
              echo "::error file=$file::PHP syntax error"
              php -l "$file" || true
              fail=1
            fi
          done < <(
            find application \
              \( -path 'application/third_party/*/vendor' \
                 -o -path 'application/third_party/*/*/vendor' \
                 -o -path 'application/libraries/Zend' \
                 -o -path 'application/libraries/Zend/*' \
                 -o -path 'application/vendor' \
                 -o -path 'application/vendor/*' \) -prune -o \
              -type f -name '*.php' ! -name 'Zend.php' -print0
          )
          for file in index.php seed-admin.php cli/*.php; do
            [ -f "$file" ] || continue
            if ! php -l "$file" >/dev/null; then
              echo "::error file=$file::PHP syntax error"
              php -l "$file" || true
              fail=1
            fi
          done
          if [ "$fail" -ne 0 ]; then
            echo "PHP syntax check failed"
            exit 1
          fi
          echo "PHP syntax check passed"

  deploy:
    name: Deploy to hospital.ampletobuy.com
    needs: ci-gate
    runs-on: ubuntu-latest
    environment: features
    env:
      BUILD_ON_VPS: ${{ github.event.inputs.build_on_vps || 'true' }}
      HEALTHCHECK_URL: ${{ secrets.DEPLOY_HEALTHCHECK_URL }}
    steps:
      - name: Validate deploy config
        env:
          HOST_SECRET: ${{ secrets.VPS_HOST }}
          HOST_VAR: ${{ vars.VPS_HOST }}
          USER_SECRET: ${{ secrets.VPS_USER }}
          USER_VAR: ${{ vars.VPS_USER }}
          SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          set -euo pipefail
          HOST="$(printf '%s' "${HOST_SECRET:-${HOST_VAR:-}}" | tr -d '\r' | xargs)"
          if [ -z "$HOST" ]; then
            echo "::error::VPS_HOST missing on Environment 'features' (use 50.6.44.85)."
            exit 1
          fi
          if [ -z "${SSH_KEY:-}" ]; then
            echo "::error::VPS_SSH_KEY missing on Environment 'features'."
            exit 1
          fi

      - name: Resolve SSH host
        id: ssh
        env:
          HOST_SECRET: ${{ secrets.VPS_HOST }}
          HOST_VAR: ${{ vars.VPS_HOST }}
          USER_SECRET: ${{ secrets.VPS_USER }}
          USER_VAR: ${{ vars.VPS_USER }}
        run: |
          set -euo pipefail
          HOST="$(printf '%s' "${HOST_SECRET:-${HOST_VAR:-}}" | tr -d '\r' | xargs)"
          USER="$(printf '%s' "${USER_SECRET:-${USER_VAR:-}}" | tr -d '\r' | xargs)"
          USER="${USER:-deploy}"
          HOST="${HOST#ssh://}"
          HOST="${HOST#https://}"
          HOST="${HOST#http://}"
          if [[ "$HOST" == *@* ]]; then
            USER="${HOST%%@*}"
            HOST="${HOST#*@}"
          fi
          HOST="${HOST%%/*}"
          HOST="${HOST%%:*}"
          echo "host=${HOST}" >> "$GITHUB_OUTPUT"
          echo "user=${USER}" >> "$GITHUB_OUTPUT"

      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ steps.ssh.outputs.host }}
          username: ${{ steps.ssh.outputs.user }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22
          script_stop: true
          command_timeout: 30m
          envs: BUILD_ON_VPS,HEALTHCHECK_URL
          script: |
            set -euo pipefail
            cd /opt/hospital
            git fetch origin Features
            git checkout Features
            git reset --hard origin/Features
            export HOSPITAL_IMAGE_TAG=latest
            export DEPLOY_HEALTHCHECK_URL="${HEALTHCHECK_URL:-https://hospital.ampletobuy.com/}"
            export HOSPITAL_BUILD_ON_VPS="${BUILD_ON_VPS:-true}"
            chmod +x ./scripts/deploy.sh
            ./scripts/deploy.sh
