server {
    listen 80;
    listen [::]:80;
    server_name _;

    # CodeIgniter document root is the repo root
    root /var/www/html;
    index index.php;

    charset utf-8;
    client_max_body_size 64M;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    # Protect application / system / env
    location ~ ^/(application|system|cli|docs|\.git|\.env) {
        deny all;
        return 404;
    }

    location ~ \.php$ {
        # Use container_name — on shared Traefik "edge" network, service name
        # "app" can resolve to another stack and cause 502.
        fastcgi_pass hospital-app:9000;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_hide_header X-Powered-By;
        fastcgi_read_timeout 300;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}
